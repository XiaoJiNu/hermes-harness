name: ci

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/check_control_plane.py
      - run: python3 -m pip install pytest
      - run: python3 -m pytest tests/structure -q
